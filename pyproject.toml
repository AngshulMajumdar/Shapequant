[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shapequant"
version = "0.1.0"
description = "Data-free, training-free noise-shaped quantization of Hugging Face causal LMs (GPTQ-format output)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Angshul Majumdar", email = "angshul@iiitd.ac.in" }]
dependencies = ["torch>=2.1", "safetensors>=0.4", "transformers>=4.40", "accelerate>=0.26", "huggingface_hub>=0.20"]

[project.optional-dependencies]
eval = ["datasets"]
test = ["pytest"]

[project.scripts]
shapequant = "shapequant.cli:main"

[tool.setuptools]
packages = ["shapequant"]
